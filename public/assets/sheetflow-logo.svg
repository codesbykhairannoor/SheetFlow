<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradient: Google Sheets Emerald into Canva Electric Cyan -->
    <linearGradient id="sheetflowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F9D58" />
      <stop offset="40%" stop-color="#10B981" />
      <stop offset="70%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.10" />
    </filter>
  </defs>

  <!-- Clean Canvas (No Background Clutter) -->
  <g filter="url(#subtleShadow)" stroke="url(#sheetflowGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none">
    
    <!-- Outer "S" Flowing Ribbon Silhouette -->
    <!-- Top arc of S -->
    <path d="M 370 128 L 220 128 C 160 128, 142 168, 142 228 C 142 288, 170 288, 256 288 C 342 288, 370 288, 370 348 C 370 408, 352 448, 292 448 L 142 448" />

    <!-- Horizontal Spreadsheet Grid Divider Lines -->
    <path d="M 142 188 L 370 188" stroke-width="12" />
    <path d="M 142 248 L 370 248" stroke-width="12" />
    <path d="M 142 328 L 370 328" stroke-width="12" />
    <path d="M 142 388 L 370 388" stroke-width="12" />

    <!-- Vertical Spreadsheet Column Divider Lines -->
    <path d="M 218 128 L 218 448" stroke-width="12" />
    <path d="M 294 128 L 294 448" stroke-width="12" />

  </g>
</svg>
